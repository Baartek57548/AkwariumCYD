<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 1024 600">
  <title>AquaCYD HMI — Controls Ready</title>
  <desc>Edytowalna makieta sterowania 1024 na 600 do importu w Figma.</desc>
  <rect id="Canvas" width="1024" height="600" fill="#0B1020"/>

  <g id="Header">
    <rect width="1024" height="82" fill="#10182A"/>
    <text x="24" y="34" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="28" font-weight="700">Sterowanie czasowe</text>
    <text x="24" y="62" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Zabezpieczenia i automatyka pozostają aktywne w CYD</text>
    <rect x="818" y="20" width="182" height="42" rx="21" fill="#17372D" stroke="#65D69B"/>
    <circle cx="844" cy="41" r="7" fill="#65D69B"/>
    <text x="861" y="47" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="16" font-weight="600">GOTOWY</text>
  </g>

  <g id="Navigation">
    <rect y="82" width="1024" height="56" fill="#10182A"/>
    <text x="72" y="116" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Podgląd</text>
    <rect x="222" y="92" width="190" height="36" rx="14" fill="#4D8DFF"/>
    <text x="270" y="116" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16" font-weight="600">Sterowanie</text>
    <text x="467" y="116" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Alarmy</text>
    <text x="604" y="116" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Ustawienia</text>
    <text x="787" y="116" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">System</text>
  </g>

  <g id="Duration">
    <rect x="24" y="158" width="976" height="74" rx="18" fill="#172033" stroke="#2A3B59"/>
    <text x="48" y="190" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Czas ręcznego wymuszenia</text>
    <text x="48" y="217" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="24" font-weight="600">15 minut</text>
    <rect x="792" y="175" width="184" height="40" rx="14" fill="#252D3D"/>
    <text x="884" y="201" text-anchor="middle" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16">Zmień czas</text>
  </g>

  <g id="Light-Primary">
    <rect x="24" y="252" width="310" height="132" rx="18" fill="#172033" stroke="#2A3B59"/>
    <text x="44" y="286" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="20" font-weight="600">Światło główne</text>
    <text x="44" y="316" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="16">Aktualnie ON</text>
    <rect x="44" y="332" width="118" height="36" rx="14" fill="#4D8DFF"/>
    <text x="103" y="355" text-anchor="middle" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16">Włącz</text>
    <rect x="176" y="332" width="118" height="36" rx="14" fill="#252D3D"/>
    <text x="235" y="355" text-anchor="middle" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16">Wyłącz</text>
  </g>

  <g id="Light-Secondary">
    <rect x="357" y="252" width="310" height="132" rx="18" fill="#172033" stroke="#2A3B59"/>
    <text x="377" y="286" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="20" font-weight="600">Światło roślinne</text>
    <text x="377" y="316" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Aktualnie OFF</text>
    <rect x="377" y="332" width="118" height="36" rx="14" fill="#4D8DFF"/>
    <text x="436" y="355" text-anchor="middle" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16">Włącz</text>
    <rect x="509" y="332" width="118" height="36" rx="14" fill="#252D3D"/>
    <text x="568" y="355" text-anchor="middle" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16">Wyłącz</text>
  </g>

  <g id="Filter">
    <rect x="690" y="252" width="310" height="132" rx="18" fill="#172033" stroke="#2A3B59"/>
    <text x="710" y="286" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="20" font-weight="600">Filtr</text>
    <text x="710" y="316" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="16">Aktualnie ON</text>
    <rect x="710" y="332" width="118" height="36" rx="14" fill="#4D8DFF"/>
    <text x="769" y="355" text-anchor="middle" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16">Włącz</text>
    <rect x="842" y="332" width="118" height="36" rx="14" fill="#252D3D"/>
    <text x="901" y="355" text-anchor="middle" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16">Wyłącz</text>
  </g>

  <g id="Aerator">
    <rect x="24" y="404" width="310" height="132" rx="18" fill="#172033" stroke="#2A3B59"/>
    <text x="44" y="438" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="20" font-weight="600">Napowietrzanie</text>
    <text x="44" y="468" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="16">Aktualnie ON</text>
    <rect x="44" y="484" width="118" height="36" rx="14" fill="#4D8DFF"/>
    <text x="103" y="507" text-anchor="middle" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16">Włącz</text>
    <rect x="176" y="484" width="118" height="36" rx="14" fill="#252D3D"/>
    <text x="235" y="507" text-anchor="middle" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16">Wyłącz</text>
  </g>

  <g id="Feeding">
    <rect x="357" y="404" width="310" height="132" rx="18" fill="#172033" stroke="#2A3B59"/>
    <text x="377" y="438" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="20" font-weight="600">Tryb karmienia</text>
    <text x="377" y="468" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">10 minut + jedna dawka</text>
    <rect x="377" y="484" width="250" height="36" rx="14" fill="#4D8DFF"/>
    <text x="502" y="507" text-anchor="middle" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16" font-weight="600">Rozpocznij</text>
  </g>

  <g id="Snapshot">
    <rect x="690" y="404" width="310" height="132" rx="18" fill="#172033" stroke="#2A3B59"/>
    <text x="710" y="438" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="20" font-weight="600">Stan sterownika</text>
    <text x="710" y="468" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Rewizja 1234ABCD</text>
    <rect x="710" y="484" width="250" height="36" rx="14" fill="#252D3D"/>
    <text x="835" y="507" text-anchor="middle" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16">Odśwież snapshot</text>
  </g>

  <text x="24" y="576" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="14">Każde polecenie wymaga aplikacyjnego ACK z CYD.</text>
</svg>
