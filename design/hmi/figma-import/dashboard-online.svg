<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 1024 600">
  <title>AquaCYD HMI — Dashboard Online</title>
  <desc>Edytowalna makieta 1024 na 600 do importu w Figma.</desc>
  <rect id="Canvas" width="1024" height="600" fill="#0B1020"/>

  <g id="Header">
    <rect width="1024" height="82" fill="#10182A"/>
    <text x="24" y="34" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="28" font-weight="700">AquaCYD</text>
    <text x="24" y="62" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="16">MQTT online  •  CYD online  •  ESP-NOW -54 dBm</text>
    <rect x="818" y="20" width="182" height="42" rx="21" fill="#17372D" stroke="#65D69B"/>
    <circle cx="844" cy="41" r="7" fill="#65D69B"/>
    <text x="861" y="47" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="16" font-weight="600">SYSTEM OK</text>
  </g>

  <g id="Navigation">
    <rect y="82" width="1024" height="56" fill="#10182A"/>
    <rect x="24" y="92" width="176" height="36" rx="14" fill="#4D8DFF"/>
    <text x="71" y="116" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16" font-weight="600">Podgląd</text>
    <text x="279" y="116" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Sterowanie</text>
    <text x="454" y="116" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Alarmy</text>
    <text x="591" y="116" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Ustawienia</text>
    <text x="774" y="116" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">System</text>
  </g>

  <g id="Metric-Temperature">
    <rect x="24" y="158" width="300" height="168" rx="18" fill="#172033" stroke="#2A3B59"/>
    <text x="44" y="191" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="20">Temperatura</text>
    <text x="44" y="258" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="40" font-weight="700">24.68 °C</text>
    <text x="44" y="297" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="16">Cel 24.5 °C  •  stabilna</text>
  </g>

  <g id="Metric-pH">
    <rect x="342" y="158" width="300" height="168" rx="18" fill="#172033" stroke="#2A3B59"/>
    <text x="362" y="191" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="20">pH</text>
    <text x="362" y="258" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="40" font-weight="700">7.126</text>
    <text x="362" y="297" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="16">Pomiar ważny</text>
  </g>

  <g id="Metric-EC">
    <rect x="660" y="158" width="340" height="168" rx="18" fill="#172033" stroke="#2A3B59"/>
    <text x="680" y="191" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="20">Przewodność</text>
    <text x="680" y="258" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="40" font-weight="700">512 µS/cm</text>
    <text x="680" y="297" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="16">Pomiar ważny</text>
  </g>

  <g id="Outputs">
    <rect x="24" y="346" width="618" height="226" rx="18" fill="#172033" stroke="#2A3B59"/>
    <text x="44" y="382" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="24" font-weight="600">Wyjścia</text>
    <g id="Output-Light">
      <rect x="44" y="406" width="174" height="58" rx="14" fill="#17372D"/>
      <circle cx="67" cy="435" r="7" fill="#65D69B"/>
      <text x="84" y="441" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16">Światło ON</text>
    </g>
    <g id="Output-Plant">
      <rect x="234" y="406" width="178" height="58" rx="14" fill="#252D3D"/>
      <circle cx="257" cy="435" r="7" fill="#8FA7C7"/>
      <text x="274" y="441" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16">Roślinne OFF</text>
    </g>
    <g id="Output-Filter">
      <rect x="428" y="406" width="174" height="58" rx="14" fill="#17372D"/>
      <circle cx="451" cy="435" r="7" fill="#65D69B"/>
      <text x="468" y="441" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16">Filtr ON</text>
    </g>
    <g id="Output-Air">
      <rect x="44" y="480" width="268" height="58" rx="14" fill="#17372D"/>
      <circle cx="67" cy="509" r="7" fill="#65D69B"/>
      <text x="84" y="515" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16">Napowietrzanie ON</text>
    </g>
    <g id="Output-Heater">
      <rect x="328" y="480" width="274" height="58" rx="14" fill="#252D3D"/>
      <circle cx="351" cy="509" r="7" fill="#8FA7C7"/>
      <text x="368" y="515" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16">Grzałka OFF</text>
    </g>
  </g>

  <g id="Environment">
    <rect x="660" y="346" width="340" height="226" rx="18" fill="#172033" stroke="#2A3B59"/>
    <text x="680" y="382" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="24" font-weight="600">Stan akwarium</text>
    <text x="680" y="426" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">LDR</text>
    <text x="958" y="426" text-anchor="end" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="20">1840</text>
    <text x="680" y="466" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Poziom wody</text>
    <text x="958" y="466" text-anchor="end" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="20">OK</text>
    <text x="680" y="506" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Wyciek</text>
    <text x="958" y="506" text-anchor="end" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="20">BRAK</text>
    <text x="680" y="546" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Alarmy</text>
    <text x="958" y="546" text-anchor="end" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="20">0</text>
  </g>
</svg>
