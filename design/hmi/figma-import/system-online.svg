<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 1024 600">
  <title>AquaCYD HMI — System Online</title>
  <desc>Edytowalna makieta systemowa 1024 na 600 do importu w Figma.</desc>
  <rect id="Canvas" width="1024" height="600" fill="#0B1020"/>

  <g id="Header">
    <rect width="1024" height="82" fill="#10182A"/>
    <text x="24" y="34" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="28" font-weight="700">System i diagnostyka</text>
    <text x="24" y="62" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Panel P4, CYD, ESP-NOW i MQTT</text>
    <rect x="818" y="20" width="182" height="42" rx="21" fill="#17372D" stroke="#65D69B"/>
    <circle cx="844" cy="41" r="7" fill="#65D69B"/>
    <text x="861" y="47" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="16" font-weight="600">ONLINE</text>
  </g>

  <g id="Navigation">
    <rect y="82" width="1024" height="56" fill="#10182A"/>
    <text x="72" y="116" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Podgląd</text>
    <text x="277" y="116" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Sterowanie</text>
    <text x="467" y="116" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Alarmy</text>
    <text x="604" y="116" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Ustawienia</text>
    <rect x="758" y="92" width="178" height="36" rx="14" fill="#4D8DFF"/>
    <text x="806" y="116" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="16" font-weight="600">System</text>
  </g>

  <g id="Brightness">
    <rect x="24" y="158" width="976" height="104" rx="18" fill="#172033" stroke="#2A3B59"/>
    <text x="48" y="192" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="20" font-weight="600">Jasność ekranu</text>
    <rect x="48" y="218" width="806" height="12" rx="6" fill="#2A3B59"/>
    <rect x="48" y="218" width="645" height="12" rx="6" fill="#4D8DFF"/>
    <circle cx="693" cy="224" r="14" fill="#F4F7FC" stroke="#4D8DFF" stroke-width="4"/>
    <text x="950" y="232" text-anchor="end" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="24" font-weight="600">80%</text>
  </g>

  <g id="Controller">
    <rect x="24" y="282" width="468" height="260" rx="18" fill="#172033" stroke="#2A3B59"/>
    <text x="48" y="320" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="24" font-weight="600">Sterownik CYD</text>
    <text x="48" y="362" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Uptime</text>
    <text x="464" y="362" text-anchor="end" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="18">184 320 s</text>
    <text x="48" y="400" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Wolna pamięć</text>
    <text x="464" y="400" text-anchor="end" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="18">121 840 B</text>
    <text x="48" y="438" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Rewizja konfiguracji</text>
    <text x="464" y="438" text-anchor="end" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="18">1234ABCD</text>
    <text x="48" y="476" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">ESP-NOW</text>
    <text x="464" y="476" text-anchor="end" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="18">-54 dBm</text>
    <text x="48" y="514" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Fail-safe</text>
    <text x="464" y="514" text-anchor="end" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="18">OK</text>
  </g>

  <g id="Panel">
    <rect x="512" y="282" width="488" height="260" rx="18" fill="#172033" stroke="#2A3B59"/>
    <text x="536" y="320" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="24" font-weight="600">Panel ESP32-P4</text>
    <text x="536" y="362" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Wolna pamięć</text>
    <text x="972" y="362" text-anchor="end" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="18">18.6 MB</text>
    <text x="536" y="400" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Wi-Fi</text>
    <text x="972" y="400" text-anchor="end" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="18">online</text>
    <text x="536" y="438" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">MQTT</text>
    <text x="972" y="438" text-anchor="end" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="18">online</text>
    <text x="536" y="476" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">Home Assistant</text>
    <text x="972" y="476" text-anchor="end" fill="#65D69B" font-family="Montserrat, sans-serif" font-size="18">dostępny</text>
    <text x="536" y="514" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="16">BSP</text>
    <text x="972" y="514" text-anchor="end" fill="#F4F7FC" font-family="Montserrat, sans-serif" font-size="18">Waveshare 7B</text>
  </g>

  <text x="24" y="576" fill="#8FA7C7" font-family="Montserrat, sans-serif" font-size="14">Ustawienia panelu są lokalne; bezpieczeństwo pozostaje w CYD.</text>
</svg>
