; Aktywne środowiska dla WeMos D1 i ESP32-S3 Waveshare 16249.
; Domyślny cel jest pojedynczy, aby polecenie upload nie programowało kilku płyt.

[platformio]
default_envs = esp32s3_waveshare_ui
src_dir = firmware

[env:esp32s3_n16r8_bringup]
platform = platformio/espressif32@7.0.1
board = esp32-s3-wroom-1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = -<*> +<esp32s3_bringup/src/*>
build_flags =
    -finput-charset=UTF-8
    -fexec-charset=UTF-8

[env:esp32s3_waveshare_lcd_test]
platform = platformio/espressif32@7.0.1
board = esp32-s3-wroom-1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = -<*> +<esp32s3_lcd_test/src/*>
build_flags =
    -finput-charset=UTF-8
    -fexec-charset=UTF-8

[env:esp32s3_waveshare_ui]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38
board = esp32-s3-wroom-1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@^6.21.4
build_src_filter = -<*> +<esp32s3_ui/src/*>
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I firmware/esp32s3_ui/include
    -finput-charset=UTF-8
    -fexec-charset=UTF-8

[wemos_firmware]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.ldscript = eagle.flash.4m2m.ld
lib_extra_dirs = firmware/shared
lib_deps =
    bblanchon/ArduinoJson@^6.21.4
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@^4.0.6
build_flags =
    -I firmware/wemos_controller/include
    -finput-charset=UTF-8
    -fexec-charset=UTF-8

[env:wemos_d1_uno]
extends = wemos_firmware
build_src_filter = -<*> +<wemos_controller/src/*>

[env:test_wemos_diag]
extends = wemos_firmware
build_src_filter = -<*> +<wemos_tests/test_interactive_diag.cpp>

[env:test_wemos_i2c]
extends = wemos_firmware
build_src_filter = -<*> +<wemos_tests/test_i2c_scanner.cpp>

[env:test_wemos_relays]
extends = wemos_firmware
build_src_filter = -<*> +<wemos_tests/test_mcp23017_relays.cpp>

[env:test_wemos_temp]
extends = wemos_firmware
build_src_filter = -<*> +<wemos_tests/test_ds18b20_temp.cpp>

[env:test_wemos_rtc]
extends = wemos_firmware
build_src_filter = -<*> +<wemos_tests/test_ds3231_rtc.cpp>

[env:test_wemos_ads1115]
extends = wemos_firmware
build_src_filter = -<*> +<wemos_tests/test_ads1115_adc.cpp>
