; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
build_dir = C:/tmp/cydaquarium_bazowa_pio_build

[env:esp32dev]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    lvgl/lvgl@^8.3.11
    lovyan03/LovyanGFX@^1.1.16
    paulstoffregen/OneWire@^2.3.8
    h2zero/NimBLE-Arduino@^2.5.0

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D CORE_DEBUG_LEVEL=3
    -finput-charset=UTF-8
    -fexec-charset=UTF-8

board_build.partitions = min_spiffs.csv

[env:native]
platform = native
platform_packages =
    platformio/toolchain-gccmingw32
extra_scripts = pre:scripts/native_toolchain.py
test_framework = unity
test_filter = test_native_domain
test_build_src = no
build_flags =
    -std=gnu++11
    -static
    -static-libgcc
    -static-libstdc++
