name: cyd_aquarium_mobile
description: AquaCYD Control — mobilny panel sterownika akwarium dla Androida i iOS.
publish_to: 'none'
version: 3.2.0+6

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  flutter_reactive_ble: ^5.5.0
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.10.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/aquacyd-control-icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/aquacyd-control-icon.png
  min_sdk_android: 24
  remove_alpha_ios: true
