name: Publish validated release

on:
  push:
    tags:
      - "mobile-v*.*.*"
      - "home-v*.*.*"
      - "firmware-v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mobile:
    name: Signed Android release
    if: ${{ startsWith(github.ref_name, 'mobile-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production-mobile
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Require the mobile tag commit to be on origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git merge-base --is-ancestor \
            "$tag_commit" \
            refs/remotes/origin/main || {
              echo \
                "Mobile tag commit $tag_commit is not reachable from origin/main" \
                >&2
              exit 1
            }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.14"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - name: Validate tag against pubspec before signing
        run: >
          python scripts/validate_release.py
          --tag "$GITHUB_REF_NAME"
          --pubspec apps/aquacyd_service/pubspec.yaml
          --dry-run
      - name: Materialize signing identity and prepare Gradle wrapper
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            ANDROID_STORE_PASSWORD
          do
            test -n "${!name}" || {
              echo "Required signing secret $name is absent" >&2
              exit 1
            }
          done
          umask 077
          key_path="$RUNNER_TEMP/aquacyd-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$key_path"
          test -s "$key_path"
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$key_path"
          } > apps/aquacyd_service/android/key.properties
          flutter_sdk="$(dirname "$(dirname "$(command -v flutter)")")"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' \
            "$android_sdk" "$flutter_sdk" \
            > apps/aquacyd_service/android/local.properties
          chmod +x apps/aquacyd_service/android/gradlew
      - name: Resolve and analyze Flutter
        working-directory: apps/aquacyd_service
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Run Android unit tests
        working-directory: apps/aquacyd_service/android
        run: ./gradlew testCurrentDebugUnitTest --no-daemon --console=plain
      - name: Build signed APK
        working-directory: apps/aquacyd_service
        shell: bash
        env:
          AQUACYD_FIREBASE_API_KEY: ${{ vars.AQUACYD_FIREBASE_API_KEY }}
          AQUACYD_FIREBASE_APP_ID: ${{ vars.AQUACYD_FIREBASE_APP_ID }}
          AQUACYD_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.AQUACYD_FIREBASE_MESSAGING_SENDER_ID }}
          AQUACYD_FIREBASE_PROJECT_ID: ${{ vars.AQUACYD_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          firebase_names=(
            AQUACYD_FIREBASE_API_KEY
            AQUACYD_FIREBASE_APP_ID
            AQUACYD_FIREBASE_MESSAGING_SENDER_ID
            AQUACYD_FIREBASE_PROJECT_ID
          )
          firebase_args=()
          missing_names=()
          configured_count=0

          for name in "${firebase_names[@]}"; do
            value="${!name}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              missing_names+=("$name")
              continue
            fi
            if [[ "$value" =~ [[:space:]] ]]; then
              echo "GitHub variable $name contains whitespace" >&2
              exit 1
            fi
            configured_count=$((configured_count + 1))
            firebase_args+=("--dart-define=$name=$value")
          done

          if (( configured_count != 0 && configured_count != 4 )); then
            printf \
              'Firebase release configuration must contain either 0 or all 4 variables; missing:' \
              >&2
            printf ' %s' "${missing_names[@]}" >&2
            printf '\n' >&2
            exit 1
          fi

          if (( configured_count == 4 )); then
            echo \
              "::notice title=AquaCYD APK push mode::Firebase remote push enabled"
            printf \
              '### AquaCYD APK push mode\n\nFirebase remote push enabled.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo \
              "::notice title=AquaCYD APK push mode::Explicit local-only mode; Firebase variables are absent"
            printf \
              '### AquaCYD APK push mode\n\nExplicit local-only mode; Firebase is not initialized.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          flutter build apk \
            --release \
            --flavor current \
            --target lib/main.dart \
            "${firebase_args[@]}"
      - name: Verify notification icon survived release shrinking
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/aquacyd_service/build/app/outputs/flutter-apk/app-current-release.apk"
          build_tools="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools"
          aapt_path="$(
            find "$build_tools" -type f -name aapt -print |
              sort -V |
              tail -n 1
          )"
          resources="$RUNNER_TEMP/aquacyd-apk-resources.txt"
          test -s "$apk"
          test -x "$aapt_path"
          "$aapt_path" dump resources "$apk" > "$resources"
          grep -F \
            "pl.cydakwarium.cyd_aquarium_mobile:drawable/ic_notification" \
            "$resources" >/dev/null || {
              echo "Release APK does not contain drawable/ic_notification" >&2
              exit 1
            }
      - name: Verify package, version, signature and SHA-256
        id: metadata
        shell: bash
        env:
          EXPECTED_ANDROID_CERT_SHA256: 394b82b7779b9b07375237fb5233082d416c75a06dfc3a232955861176880e9e
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#mobile-v}"
          output_dir="$RUNNER_TEMP/mobile-release"
          apk="$output_dir/AquaCYD-Control-$version-current.apk"
          mkdir -p "$output_dir"
          cp \
            apps/aquacyd_service/build/app/outputs/flutter-apk/app-current-release.apk \
            "$apk"
          build_tools="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools"
          aapt_path="$(find "$build_tools" -type f -name aapt -print | sort -V | tail -n 1)"
          apksigner_path="$(
            find "$build_tools" -type f -name apksigner -print |
              sort -V |
              tail -n 1
          )"
          test -x "$aapt_path"
          test -x "$apksigner_path"
          badging_output="$("$aapt_path" dump badging "$apk")"
          badging="${badging_output%%$'\n'*}"
          package_name="$(sed -n "s/.*package: name='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          version_code="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          version_name="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          signer_output="$("$apksigner_path" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$signer_output"
          signer_count="$(
            sed -n 's/^Number of signers: //p' <<<"$signer_output"
          )"
          test "$signer_count" = "1" || {
            echo "APK must contain exactly one signer" >&2
            exit 1
          }
          certificate_sha="$(
            sed -n 's/^.*certificate SHA-256 digest: //p' <<<"$signer_output" |
              tr '[:upper:]' '[:lower:]' |
              tr -d ':[:space:]'
          )"
          test "$certificate_sha" = "$EXPECTED_ANDROID_CERT_SHA256" || {
            echo "APK was signed by an unexpected certificate" >&2
            exit 1
          }
          python scripts/validate_release.py \
            --tag "$GITHUB_REF_NAME" \
            --asset "$apk" \
            --pubspec apps/aquacyd_service/pubspec.yaml \
            --package-name "$package_name" \
            --apk-version-name "$version_name" \
            --apk-version-code "$version_code" \
            --checksums "$output_dir/SHA256SUMS" \
            --manifest "$output_dir/release-manifest.json"
          (
            cd "$output_dir"
            sha256sum --check SHA256SUMS
          )
          {
            echo "directory=$output_dir"
            echo "apk=$apk"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Generate mobile CycloneDX SBOM
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.metadata.outputs.directory }}
          RELEASE_APK: ${{ steps.metadata.outputs.apk }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#mobile-v}"
          python tools/generate_sbom.py \
            --kind mobile \
            --version "$version" \
            --artifact "$RELEASE_APK" \
            --output "$RELEASE_DIR/AquaCYD-Control-$version.cdx.json"
      - name: Attest mobile build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.metadata.outputs.apk }}
      - name: Attest mobile SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.metadata.outputs.apk }}
          sbom-path: ${{ steps.metadata.outputs.directory }}/AquaCYD-Control-${{ steps.metadata.outputs.version }}.cdx.json
      - name: Refuse overwrite of an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing overwrite" >&2
            exit 1
          fi
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ steps.metadata.outputs.directory }}
          RELEASE_APK: ${{ steps.metadata.outputs.apk }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_APK" \
            "$RELEASE_DIR/SHA256SUMS" \
            "$RELEASE_DIR/release-manifest.json" \
            "$RELEASE_DIR/AquaCYD-Control-${GITHUB_REF_NAME#mobile-v}.cdx.json" \
            --verify-tag \
            --title "AquaCYD Control ${GITHUB_REF_NAME#mobile-v}" \
            --generate-notes
      - name: Remove signing material
        if: always()
        run: |
          rm -f \
            apps/aquacyd_service/android/key.properties \
            "$RUNNER_TEMP/aquacyd-release.jks"

  home-windows:
    name: Home Control Windows release artifact
    if: ${{ startsWith(github.ref_name, 'home-v') }}
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - name: Install pinned Inno Setup
        id: inno
        shell: pwsh
        run: |
          $compiler = ./scripts/install_inno_setup.ps1
          "compiler=$compiler" >> $env:GITHUB_OUTPUT
      - name: Validate Home Control tag
        shell: pwsh
        run: >
          python scripts/validate_release.py
          --tag $env:GITHUB_REF_NAME
          --pubspec apps/home_control/pubspec.yaml
          --dry-run
      - name: Build Windows bundle and installer wizard
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^home-v', ''
          ./scripts/build_home_control_windows.ps1 `
            -ExpectedVersion $version `
            -InnoCompiler '${{ steps.inno.outputs.compiler }}' `
            -OutputDirectory artifacts/home-control-windows
      - name: Verify Windows installer identity
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^home-v', ''
          $setup = Join-Path `
            $PWD `
            "artifacts/home-control-windows/Home-Control-$version-Windows-x64-Setup.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw "Expected Windows Setup is absent: $setup"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'NotSigned') {
            throw "Unexpected Authenticode status: $($signature.Status)."
          }
          Get-FileHash -LiteralPath $setup -Algorithm SHA256 | Format-List
      - name: Smoke-test release install and uninstall
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^home-v', ''
          $setup = Join-Path `
            $PWD `
            "artifacts/home-control-windows/Home-Control-$version-Windows-x64-Setup.exe"
          ./scripts/test_home_control_windows_installer.ps1 `
            -InstallerPath $setup `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP 'Home Control release smoke')
      - name: Attest Windows installer build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: artifacts/home-control-windows/*-Setup.exe
      - name: Upload Windows release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: home-control-windows-release
          path: artifacts/home-control-windows/*-Setup.exe
          if-no-files-found: error
          retention-days: 7

  home:
    name: Home Control release
    needs: home-windows
    if: ${{ startsWith(github.ref_name, 'home-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production-mobile
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Download Windows release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: home-control-windows-release
          path: ${{ runner.temp }}/home-windows
      - name: Require the home tag commit to be on origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "Home tag commit $tag_commit is not reachable from origin/main" >&2
            exit 1
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.14"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - name: Validate Home Control tag
        run: >
          python scripts/validate_release.py
          --tag "$GITHUB_REF_NAME"
          --pubspec apps/home_control/pubspec.yaml
          --dry-run
      - name: Materialize signing identity
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            ANDROID_STORE_PASSWORD
          do
            test -n "${!name}" || {
              echo "Required signing secret $name is absent" >&2
              exit 1
            }
          done
          umask 077
          key_path="$RUNNER_TEMP/aquacyd-home-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$key_path"
          test -s "$key_path"
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$key_path"
          } > apps/home_control/android/key.properties
          flutter_sdk="$(dirname "$(dirname "$(command -v flutter)")")"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' \
            "$android_sdk" "$flutter_sdk" \
            > apps/home_control/android/local.properties
          chmod +x apps/home_control/android/gradlew
      - name: Prewarm Home Control Gradle wrapper
        working-directory: apps/home_control/android
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Gradle wrapper bootstrap failed after $attempt attempts" >&2
              exit 1
            fi
            delay_seconds=$((attempt * 10))
            echo "Gradle wrapper bootstrap failed; retrying in ${delay_seconds}s" >&2
            sleep "$delay_seconds"
          done
      - name: Analyze and test Home Control
        working-directory: apps/home_control
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build signed Home Control APK
        working-directory: apps/home_control
        run: flutter build apk --release
      - name: Verify package, version, signature and SHA-256
        id: home_metadata
        shell: bash
        env:
          EXPECTED_ANDROID_CERT_SHA256: 394b82b7779b9b07375237fb5233082d416c75a06dfc3a232955861176880e9e
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#home-v}"
          output_dir="$RUNNER_TEMP/home-release"
          apk="$output_dir/Home-Control-$version.apk"
          windows_setup="$output_dir/Home-Control-$version-Windows-x64-Setup.exe"
          mkdir -p "$output_dir"
          cp \
            apps/home_control/build/app/outputs/flutter-apk/app-release.apk \
            "$apk"
          cp \
            "$RUNNER_TEMP/home-windows/Home-Control-$version-Windows-x64-Setup.exe" \
            "$windows_setup"
          test -s "$windows_setup"
          build_tools="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools"
          aapt_path="$(
            find "$build_tools" -type f -name aapt -print |
              sort -V |
              tail -n 1
          )"
          apksigner_path="$(
            find "$build_tools" -type f -name apksigner -print |
              sort -V |
              tail -n 1
          )"
          test -x "$aapt_path"
          test -x "$apksigner_path"
          badging_output="$("$aapt_path" dump badging "$apk")"
          badging="${badging_output%%$'\n'*}"
          package_name="$(
            sed -n "s/.*package: name='\\([^']*\\)'.*/\\1/p" <<<"$badging"
          )"
          version_code="$(
            sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$badging"
          )"
          version_name="$(
            sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$badging"
          )"
          signer_output="$(
            "$apksigner_path" verify --verbose --print-certs "$apk"
          )"
          printf '%s\n' "$signer_output"
          signer_count="$(
            sed -n 's/^Number of signers: //p' <<<"$signer_output"
          )"
          test "$signer_count" = "1" || {
            echo "APK must contain exactly one signer" >&2
            exit 1
          }
          certificate_sha="$(
            sed -n \
              's/^.*certificate SHA-256 digest: //p' \
              <<<"$signer_output" |
              tr '[:upper:]' '[:lower:]' |
              tr -d ':[:space:]'
          )"
          test "$certificate_sha" = "$EXPECTED_ANDROID_CERT_SHA256" || {
            echo "APK was signed by an unexpected certificate" >&2
            exit 1
          }
          python scripts/validate_release.py \
            --tag "$GITHUB_REF_NAME" \
            --asset "$apk" \
            --asset "$windows_setup" \
            --pubspec apps/home_control/pubspec.yaml \
            --package-name "$package_name" \
            --apk-version-name "$version_name" \
            --apk-version-code "$version_code" \
            --checksums "$output_dir/SHA256SUMS" \
            --manifest "$output_dir/release-manifest.json"
          (
            cd "$output_dir"
            sha256sum --check SHA256SUMS
          )
          {
            echo "directory=$output_dir"
            echo "apk=$apk"
            echo "windows_setup=$windows_setup"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Generate Home Control CycloneDX SBOM
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.home_metadata.outputs.directory }}
          RELEASE_APK: ${{ steps.home_metadata.outputs.apk }}
          RELEASE_WINDOWS_SETUP: ${{ steps.home_metadata.outputs.windows_setup }}
          RELEASE_VERSION: ${{ steps.home_metadata.outputs.version }}
        run: |
          sbom="$RELEASE_DIR/Home-Control-$RELEASE_VERSION.cdx.json"
          python tools/generate_sbom.py \
            --kind home \
            --version "$RELEASE_VERSION" \
            --artifact "$RELEASE_APK" \
            --artifact "$RELEASE_WINDOWS_SETUP" \
            --output "$sbom"
          (
            cd "$RELEASE_DIR"
            sha256sum "$(basename "$sbom")" >> SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Attest Android build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.home_metadata.outputs.apk }}
      - name: Attest Android SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.home_metadata.outputs.apk }}
          sbom-path: ${{ steps.home_metadata.outputs.directory }}/Home-Control-${{ steps.home_metadata.outputs.version }}.cdx.json
      - name: Attest Windows SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.home_metadata.outputs.windows_setup }}
          sbom-path: ${{ steps.home_metadata.outputs.directory }}/Home-Control-${{ steps.home_metadata.outputs.version }}.cdx.json
      - name: Refuse overwrite of an existing Home Control release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing overwrite" >&2
            exit 1
          fi
      - name: Create and verify Home Control release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ steps.home_metadata.outputs.directory }}
          RELEASE_APK: ${{ steps.home_metadata.outputs.apk }}
          RELEASE_WINDOWS_SETUP: ${{ steps.home_metadata.outputs.windows_setup }}
          RELEASE_VERSION: ${{ steps.home_metadata.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_APK" \
            "$RELEASE_WINDOWS_SETUP" \
            "$RELEASE_DIR/SHA256SUMS" \
            "$RELEASE_DIR/release-manifest.json" \
            "$RELEASE_DIR/Home-Control-$RELEASE_VERSION.cdx.json" \
            --verify-tag \
            --draft \
            --latest=false \
            --title "Home Control $RELEASE_VERSION" \
            --notes "Home Control dla Androida i Windows z adapterami AquaHub, Home Assistant i Demo oraz dedykowanym modułem akwarium. APK jest podpisany produkcyjnym certyfikatem Android; Windows Setup jest obecnie bez Authenticode, dlatego Windows SmartScreen może wymagać ręcznego potwierdzenia. Integralność obu artefaktów chronią SHA-256, manifest, SBOM i GitHub build provenance."
          expected_assets="$(
            printf '%s\n' \
              "$(basename "$RELEASE_APK")" \
              "$(basename "$RELEASE_WINDOWS_SETUP")" \
              SHA256SUMS \
              release-manifest.json \
              "Home-Control-$RELEASE_VERSION.cdx.json" |
              LC_ALL=C sort
          )"
          actual_assets="$(
            gh release view "$GITHUB_REF_NAME" \
              --json assets \
              --jq '.assets[].name' |
              LC_ALL=C sort
          )"
          test "$actual_assets" = "$expected_assets" || {
            echo 'Release draft contains an unexpected asset set:' >&2
            printf '%s\n' "$actual_assets" >&2
            exit 1
          }
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
      - name: Remove Home Control signing material
        if: always()
        run: |
          rm -f \
            apps/home_control/android/key.properties \
            "$RUNNER_TEMP/aquacyd-home-release.jks"

  firmware-source:
    name: Validate firmware release source
    if: ${{ startsWith(github.ref_name, 'firmware-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      exact_sha: ${{ steps.source.outputs.exact_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Require an approved canonical firmware tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          [[ "$tag_commit" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor \
            "$tag_commit" \
            refs/remotes/origin/main || {
              echo \
                "Firmware tag commit $tag_commit is not reachable from origin/main" \
                >&2
              exit 1
            }
          python scripts/validate_release.py \
            --tag "$GITHUB_REF_NAME" \
            --firmware-config firmware/cyd_controller/include/config.h \
            --print-firmware-contract \
            >/dev/null
          echo "exact_sha=$tag_commit" >> "$GITHUB_OUTPUT"

  firmware-hil:
    name: Exact-commit physical HIL gate
    if: ${{ startsWith(github.ref_name, 'firmware-v') }}
    needs: firmware-source
    uses: ./.github/workflows/hil.yml
    with:
      exact_sha: ${{ needs.firmware-source.outputs.exact_sha }}
      run_hardware: true
      allow_mutations: true
      allow_ota_rollback: true
      forbid_skips: true
    secrets: inherit

  firmware-native:
    name: Firmware native tests
    if: ${{ startsWith(github.ref_name, 'firmware-v') }}
    needs: firmware-hil
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Require the firmware tag commit to be on origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git merge-base --is-ancestor \
            "$tag_commit" \
            refs/remotes/origin/main || {
              echo \
                "Firmware tag commit $tag_commit is not reachable from origin/main" \
                >&2
              exit 1
            }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/cyd_controller/platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.19
      - name: Validate HIL contract without hardware
        run: |
          python scripts/audit_esp32_security.py --self-test
          python tools/hil/runner.py --self-test
          python tools/hil/runner.py --dry-run
      - name: Run native domain tests
        run: pio test --project-dir firmware/cyd_controller --environment native

  firmware:
    name: Firmware release
    if: ${{ startsWith(github.ref_name, 'firmware-v') }}
    needs: firmware-native
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production-firmware
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/cyd_controller/platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-
      - name: Validate source contract and package tooling
        run: |
          python scripts/validate_release.py \
            --tag "$GITHUB_REF_NAME" \
            --firmware-config firmware/cyd_controller/include/config.h \
            --dry-run
          python scripts/verify_firmware_trust.py
          python tools/firmware_package.py self-test
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.19
      - name: Verify embedded web assets
        run: |
          npm ci
          npm run test:api
          npm run build:web-assets
          git diff --exit-code -- sdcard/aq/ota
      - name: Compile both display variants
        run: |
          pio run --project-dir firmware/cyd_controller --environment esp32dev
          pio run --project-dir firmware/cyd_controller --environment esp32dev-st7789
      - name: Materialize and validate the RSA-3072 signing identity
        id: signing
        shell: bash
        env:
          FIRMWARE_SIGNING_KEY_BASE64: ${{ secrets.FIRMWARE_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FIRMWARE_SIGNING_KEY_BASE64" || {
            echo "Required secret FIRMWARE_SIGNING_KEY_BASE64 is absent" >&2
            exit 1
          }

          umask 077
          private_key="$RUNNER_TEMP/aquacyd-firmware-rsa3072.pem"
          derived_public_key="$RUNNER_TEMP/aquacyd-firmware-rsa3072-public.pem"
          committed_public_key="$GITHUB_WORKSPACE/security/firmware-signing-public.pem"
          printf '%s' "$FIRMWARE_SIGNING_KEY_BASE64" |
            base64 --decode > "$private_key"
          test -s "$private_key"
          test -s "$committed_public_key"
          chmod 600 "$private_key"

          openssl pkey -in "$private_key" -check -noout
          openssl pkey -in "$private_key" -text -noout |
            grep -q '^Private-Key: (3072 bit'
          openssl pkey \
            -in "$private_key" \
            -pubout \
            -out "$derived_public_key"
          cmp \
            <(openssl pkey -pubin -in "$derived_public_key" -pubout -outform DER) \
            <(openssl pkey -pubin -in "$committed_public_key" -pubout -outform DER)

          public_key_sha256="$(
            openssl pkey \
              -pubin \
              -in "$committed_public_key" \
              -pubout \
              -outform DER |
              sha256sum |
              awk '{print $1}'
          )"
          test "${#public_key_sha256}" -eq 64
          espsecure_path="$(
            find "$HOME/.platformio/packages" \
              -type f \
              -name espsecure.py \
              -print \
              -quit
          )"
          test -f "$espsecure_path"

          {
            echo "private_key=$private_key"
            echo "derived_public_key=$derived_public_key"
            echo "public_key=$committed_public_key"
            echo "public_key_sha256=$public_key_sha256"
            echo "key_id=${public_key_sha256:0:16}"
            echo "espsecure_path=$espsecure_path"
          } >> "$GITHUB_OUTPUT"
      - name: Secure Boot v2 sign, package and verify both targets
        id: metadata
        shell: bash
        env:
          ESPSECURE_PATH: ${{ steps.signing.outputs.espsecure_path }}
          FIRMWARE_PRIVATE_KEY: ${{ steps.signing.outputs.private_key }}
          FIRMWARE_PUBLIC_KEY: ${{ steps.signing.outputs.public_key }}
          FIRMWARE_PUBLIC_KEY_SHA256: ${{ steps.signing.outputs.public_key_sha256 }}
        run: |
          set -euo pipefail
          mapfile -t contract < <(
            python scripts/validate_release.py \
              --tag "$GITHUB_REF_NAME" \
              --firmware-config firmware/cyd_controller/include/config.h \
              --print-firmware-contract |
              python -c '
          import json
          import sys
          contract = json.load(sys.stdin)
          print(contract["version"])
          print(contract["security_version"])
          print(contract["minimum_bootloader_version"])
          '
          )
          test "${#contract[@]}" -eq 3
          version="${contract[0]}"
          security_version="${contract[1]}"
          minimum_bootloader_version="${contract[2]}"
          test "$version" = "${GITHUB_REF_NAME#firmware-v}"
          [[ "$security_version" =~ ^[1-9][0-9]*$ ]]
          [[ "$minimum_bootloader_version" =~ ^[1-9][0-9]*$ ]]
          package_commit="${GITHUB_SHA,,}"
          package_commit="${package_commit:0:19}"
          [[ "$package_commit" =~ ^[0-9a-f]{19}$ ]]

          output_dir="$RUNNER_TEMP/firmware-release"
          mkdir -p "$output_dir"

          package_target() {
            local environment_name="$1"
            local target_name="$2"
            local unsigned_image="firmware/cyd_controller/.pio/build/$environment_name/firmware.bin"
            local signed_image="$output_dir/AquaCYD-Firmware-$version-$target_name-sbv2.bin"
            local ota_package="$output_dir/AquaCYD-Firmware-$version-$target_name.aqfw"
            local extracted_image="$RUNNER_TEMP/AquaCYD-$target_name-extracted.bin"
            test -s "$unsigned_image"

            python "$ESPSECURE_PATH" sign_data \
              --version 2 \
              --keyfile "$FIRMWARE_PRIVATE_KEY" \
              --output "$signed_image" \
              "$unsigned_image"
            python "$ESPSECURE_PATH" verify_signature \
              --version 2 \
              --keyfile "$FIRMWARE_PUBLIC_KEY" \
              "$signed_image"

            python tools/firmware_package.py create \
              --input "$signed_image" \
              --output "$ota_package" \
              --private-key "$FIRMWARE_PRIVATE_KEY" \
              --public-key "$FIRMWARE_PUBLIC_KEY" \
              --target "$target_name" \
              --version "$version" \
              --security-version "$security_version" \
              --commit "$package_commit" \
              --minimum-bootloader-version "$minimum_bootloader_version"
            python tools/firmware_package.py inspect \
              --package "$ota_package" \
              --public-key "$FIRMWARE_PUBLIC_KEY" \
              --target "$target_name" \
              --version "$version" \
              --security-version "$security_version"

            tail -c +513 "$ota_package" > "$extracted_image"
            cmp "$signed_image" "$extracted_image"
            python "$ESPSECURE_PATH" verify_signature \
              --version 2 \
              --keyfile "$FIRMWARE_PUBLIC_KEY" \
              "$extracted_image"
            rm -f "$extracted_image"
          }

          package_target esp32dev ili9341
          package_target esp32dev-st7789 st7789

          ili9341_bin="$output_dir/AquaCYD-Firmware-$version-ili9341-sbv2.bin"
          ili9341_aqfw="$output_dir/AquaCYD-Firmware-$version-ili9341.aqfw"
          st7789_bin="$output_dir/AquaCYD-Firmware-$version-st7789-sbv2.bin"
          st7789_aqfw="$output_dir/AquaCYD-Firmware-$version-st7789.aqfw"
          python scripts/validate_release.py \
            --tag "$GITHUB_REF_NAME" \
            --firmware-config firmware/cyd_controller/include/config.h \
            --asset "$ili9341_bin" \
            --asset "$ili9341_aqfw" \
            --asset "$st7789_bin" \
            --asset "$st7789_aqfw" \
            --checksums "$output_dir/SHA256SUMS" \
            --manifest "$output_dir/release-manifest.json"
          openssl dgst \
            -sha256 \
            -sign "$FIRMWARE_PRIVATE_KEY" \
            -sigopt rsa_padding_mode:pss \
            -sigopt rsa_pss_saltlen:32 \
            -out "$output_dir/release-manifest.json.sig" \
            "$output_dir/release-manifest.json"
          test "$(wc -c < "$output_dir/release-manifest.json.sig")" -eq 384
          openssl dgst \
            -sha256 \
            -verify "$FIRMWARE_PUBLIC_KEY" \
            -signature "$output_dir/release-manifest.json.sig" \
            -sigopt rsa_padding_mode:pss \
            -sigopt rsa_pss_saltlen:32 \
            "$output_dir/release-manifest.json"
          cp \
            "$FIRMWARE_PUBLIC_KEY" \
            "$output_dir/firmware-signing-public.pem"
          printf '%s  %s\n' \
            "$FIRMWARE_PUBLIC_KEY_SHA256" \
            "firmware-signing-public-key-der" \
            > "$output_dir/SIGNING_KEY_SHA256"
          (
            cd "$output_dir"
            sha256sum --check SHA256SUMS
          )
          {
            echo "directory=$output_dir"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Create signed, deterministic SD web bundle
        shell: bash
        env:
          FIRMWARE_PRIVATE_KEY: ${{ steps.signing.outputs.private_key }}
          FIRMWARE_PUBLIC_KEY: ${{ steps.signing.outputs.public_key }}
          RELEASE_DIR: ${{ steps.metadata.outputs.directory }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          python tools/web_package.py \
            --source sdcard/aq/ota \
            --output-dir "$RELEASE_DIR" \
            --version "$RELEASE_VERSION" \
            --commit "${GITHUB_SHA,,}" \
            --private-key "$FIRMWARE_PRIVATE_KEY" \
            --public-key "$FIRMWARE_PUBLIC_KEY"
      - name: Generate firmware and web CycloneDX SBOMs
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.metadata.outputs.directory }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          python tools/generate_sbom.py \
            --kind firmware \
            --version "$RELEASE_VERSION" \
            --artifact "$RELEASE_DIR/AquaCYD-Firmware-$RELEASE_VERSION-ili9341-sbv2.bin" \
            --artifact "$RELEASE_DIR/AquaCYD-Firmware-$RELEASE_VERSION-ili9341.aqfw" \
            --artifact "$RELEASE_DIR/AquaCYD-Firmware-$RELEASE_VERSION-st7789-sbv2.bin" \
            --artifact "$RELEASE_DIR/AquaCYD-Firmware-$RELEASE_VERSION-st7789.aqfw" \
            --output "$RELEASE_DIR/AquaCYD-Firmware-$RELEASE_VERSION.cdx.json"
          python tools/generate_sbom.py \
            --kind web \
            --version "$RELEASE_VERSION" \
            --artifact "$RELEASE_DIR/AquaCYD-Web-$RELEASE_VERSION.tar.gz" \
            --output "$RELEASE_DIR/AquaCYD-Web-$RELEASE_VERSION.cdx.json"
      - name: Extend release checksums with web bundle and SBOMs
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.metadata.outputs.directory }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          for file in \
            "AquaCYD-Web-$RELEASE_VERSION.tar.gz" \
            "AquaCYD-Web-$RELEASE_VERSION.tar.gz.sha256" \
            "AquaCYD-Web-$RELEASE_VERSION.manifest.json" \
            "AquaCYD-Web-$RELEASE_VERSION.manifest.json.sig" \
            "AquaCYD-Firmware-$RELEASE_VERSION.cdx.json" \
            "AquaCYD-Web-$RELEASE_VERSION.cdx.json"
          do
            (
              cd "$RELEASE_DIR"
              sha256sum "$file"
            ) >> "$RELEASE_DIR/SHA256SUMS"
          done
          sort -k2,2 "$RELEASE_DIR/SHA256SUMS" \
            -o "$RELEASE_DIR/SHA256SUMS"
          test -z "$(
            awk '{print $2}' "$RELEASE_DIR/SHA256SUMS" |
              sort |
              uniq -d
          )"
          (
            cd "$RELEASE_DIR"
            sha256sum --check SHA256SUMS
          )
      - name: Attest firmware build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ${{ steps.metadata.outputs.directory }}/*-sbv2.bin
            ${{ steps.metadata.outputs.directory }}/*.aqfw
      - name: Attest firmware SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ${{ steps.metadata.outputs.directory }}/*-sbv2.bin
            ${{ steps.metadata.outputs.directory }}/*.aqfw
          sbom-path: ${{ steps.metadata.outputs.directory }}/AquaCYD-Firmware-${{ steps.metadata.outputs.version }}.cdx.json
      - name: Attest web bundle build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.metadata.outputs.directory }}/AquaCYD-Web-${{ steps.metadata.outputs.version }}.tar.gz
      - name: Attest web bundle SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.metadata.outputs.directory }}/AquaCYD-Web-${{ steps.metadata.outputs.version }}.tar.gz
          sbom-path: ${{ steps.metadata.outputs.directory }}/AquaCYD-Web-${{ steps.metadata.outputs.version }}.cdx.json
      - name: Refuse overwrite of an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing overwrite" >&2
            exit 1
          fi
      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ steps.metadata.outputs.directory }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_DIR"/*-sbv2.bin \
            "$RELEASE_DIR"/*.aqfw \
            "$RELEASE_DIR/SHA256SUMS" \
            "$RELEASE_DIR/release-manifest.json" \
            "$RELEASE_DIR/release-manifest.json.sig" \
            "$RELEASE_DIR/firmware-signing-public.pem" \
            "$RELEASE_DIR/SIGNING_KEY_SHA256" \
            "$RELEASE_DIR"/AquaCYD-Web-* \
            "$RELEASE_DIR"/*.cdx.json \
            --verify-tag \
            --title "AquaCYD Firmware ${GITHUB_REF_NAME#firmware-v}" \
            --generate-notes
      - name: Remove firmware signing material
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/aquacyd-firmware-rsa3072.pem" \
            "$RUNNER_TEMP/aquacyd-firmware-rsa3072-public.pem" \
            "$RUNNER_TEMP"/AquaCYD-*-extracted.bin
