name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected products
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tooling: ${{ steps.filter.outputs.tooling }}
      web: ${{ steps.filter.outputs.web }}
      firmware: ${{ steps.filter.outputs.firmware }}
      esp_idf: ${{ steps.filter.outputs.esp_idf }}
      flutter: ${{ steps.filter.outputs.flutter }}
      home: ${{ steps.filter.outputs.home }}
      service: ${{ steps.filter.outputs.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: filter
        name: Classify changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed="__all__"
          else
            base="$BEFORE_SHA"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$BASE_SHA"
            fi
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              changed="__all__"
            else
              changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
            fi
          fi
          classify() {
            local name="$1"
            local pattern="$2"
            if [[ "$changed" == "__all__" ]] ||
               grep -Eq "$pattern" <<<"$changed"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }
          classify tooling '^(.github/|scripts/|tools/|package(-lock)?.json|pubspec.yaml)'
          classify web '^(web/|sdcard/|tools/dev-server/|tools/web-e2e/|services/remote_gateway/|package(-lock)?.json)'
          classify firmware '^(firmware/cyd_controller/|firmware/shared/|web/|sdcard/|platformio.ini)'
          classify esp_idf '^(firmware/esp32p4_hub/|firmware/esp32c6_gateway/|firmware/shared/)'
          classify flutter '^(apps/|packages/)'
          classify home '^(apps/home_control/|packages/|design/home-control/|scripts/(build_home_control_windows|install_inno_setup|test_home_control_windows_installer)\.ps1|scripts/validate_release\.py|tools/generate_sbom\.py|\.github/workflows/)'
          classify service '^(apps/aquacyd_service/|packages/)'

  secret-security:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan commits for credentials and private keys
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependency-security:
    name: Dependency vulnerability scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --recursive
        ./
      upload-sarif: false
      fail-on-vuln: true

  tooling:
    name: Release and HIL tooling
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.1"
          cache: false
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Compile Python tools
        run: python -m compileall -q scripts tools
      - name: Exercise release validator
        shell: bash
        run: |
          mobile_version="$(
            sed -n 's/^version: \([0-9][0-9.]*\)+[0-9][0-9]*$/\1/p' \
              apps/aquacyd_service/pubspec.yaml
          )"
          firmware_version="$(
            sed -n 's/^constexpr char VERSION\[\] = "\([0-9][0-9.]*\)";$/\1/p' \
              firmware/cyd_controller/include/config.h
          )"
          test -n "$mobile_version"
          test -n "$firmware_version"
          python scripts/validate_release.py --self-test
          python scripts/validate_release.py \
            --tag "mobile-v$mobile_version" \
            --pubspec apps/aquacyd_service/pubspec.yaml \
            --dry-run
          python scripts/validate_release.py \
            --tag "firmware-v$firmware_version" \
            --firmware-config firmware/cyd_controller/include/config.h \
            --dry-run
          python scripts/verify_firmware_trust.py
          python tools/firmware_package.py self-test
          python tools/web_package.py --self-test
          python tools/install_web_bundle.py --self-test
          python tools/generate_sbom.py --self-test
          python scripts/audit_esp32_security.py --self-test
      - name: Exercise HIL runner without hardware
        run: |
          python tools/hil/runner.py --self-test
          python tools/hil/runner.py --dry-run
          if python tools/hil/runner.py --dry-run --forbid-skips; then
            echo "Strict HIL dry-run unexpectedly accepted skipped scenarios" >&2
            exit 1
          fi

  web:
    name: Web and Node
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: >
          find web tools/dev-server tools/web-e2e
          -type f -name '*.js' -print0 |
          xargs -0 -n1 node --check
      - name: Run API simulator tests
        run: npm run test:api
      - name: Run secure gateway tests
        run: npm run test:gateway
      - name: Verify generated embedded web assets
        run: |
          npm run build:web-assets
          git diff --exit-code -- sdcard/aq/ota
          test -z "$(
            git ls-files \
              --others \
              --exclude-standard \
              -- sdcard/aq/ota
          )"
      - name: Install browser compatibility matrix
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser, accessibility and responsive tests
        run: npm run test:e2e
      - name: Package web artifact
        run: |
          mkdir -p artifacts
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf artifacts/AquaCYD-web-ci.tar.gz \
            web sdcard/aq/ota
          sha256sum artifacts/AquaCYD-web-ci.tar.gz \
            > artifacts/AquaCYD-web-ci.tar.gz.sha256
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-test-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload web bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-assets
          path: artifacts/AquaCYD-web-ci.tar.gz*
          if-no-files-found: error
          retention-days: 14

  firmware:
    name: PlatformIO firmware
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/cyd_controller/platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.19
      - name: Run native domain tests
        run: pio test --project-dir firmware/cyd_controller --environment native
      - name: Build production firmware variants
        run: |
          pio run --project-dir firmware/cyd_controller --environment cyd_2_8
          pio run --project-dir firmware/cyd_controller --environment esp32dev-st7789
          pio run --project-dir firmware/cyd_controller --environment esp32dev-espnow
      - name: Collect firmware binaries and checksums
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\firmware"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item `
            "firmware\cyd_controller\.pio\build\cyd_2_8\firmware.bin" `
            (Join-Path $artifactDir "AquaCYD-Firmware-ci-ili9341.bin")
          Copy-Item `
            "firmware\cyd_controller\.pio\build\esp32dev-st7789\firmware.bin" `
            (Join-Path $artifactDir "AquaCYD-Firmware-ci-st7789.bin")
          $checksumLines = Get-ChildItem -LiteralPath $artifactDir -Filter "*.bin" |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          Set-Content `
            -LiteralPath (Join-Path $artifactDir "SHA256SUMS") `
            -Value $checksumLines `
            -Encoding ascii
      - name: Upload firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-binaries
          path: artifacts/firmware/
          if-no-files-found: error
          retention-days: 14

  esp-idf-firmware:
    name: ESP32-C6 gateway and ESP32-P4 HMI
    needs: changes
    if: needs.changes.outputs.esp_idf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: espressif/idf:v5.4.4
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      NINJAFLAGS: "-j2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build ESP32-C6 gateway
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          idf.py -C firmware/esp32c6_gateway build
      - name: Build ESP32-P4 HMI
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          idf.py -C firmware/esp32p4_hub build
      - name: Collect flashable images and checksums
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/artifacts/esp-idf"
          mkdir -p "$output/c6" "$output/p4"
          cp firmware/esp32c6_gateway/build/bootloader/bootloader.bin \
            "$output/c6/"
          cp firmware/esp32c6_gateway/build/partition_table/partition-table.bin \
            "$output/c6/"
          cp firmware/esp32c6_gateway/build/ota_data_initial.bin \
            "$output/c6/"
          cp firmware/esp32c6_gateway/build/aquacyd_esp32c6_gateway.bin \
            "$output/c6/"
          cp firmware/esp32c6_gateway/build/flash_args \
            "$output/c6/"
          cp firmware/esp32p4_hub/build/bootloader/bootloader.bin \
            "$output/p4/"
          cp firmware/esp32p4_hub/build/partition_table/partition-table.bin \
            "$output/p4/"
          cp firmware/esp32p4_hub/build/ota_data_initial.bin \
            "$output/p4/"
          cp firmware/esp32p4_hub/build/aquahub_esp32p4.bin \
            "$output/p4/"
          cp firmware/esp32p4_hub/build/flash_args \
            "$output/p4/"
          (
            cd "$output"
            find c6 p4 -type f -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )
      - name: Upload ESP-IDF firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esp32-p4-c6-firmware
          path: artifacts/esp-idf/
          if-no-files-found: error
          retention-days: 14

  flutter:
    name: Flutter and Android
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.14"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - name: Create validation identity and prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/aquacyd-ci-validation.jks"
          keytool -genkeypair \
            -keystore "$key_path" \
            -storepass ci-validation-only \
            -keypass ci-validation-only \
            -alias ci-validation \
            -keyalg RSA \
            -keysize 3072 \
            -validity 1 \
            -dname "CN=AquaCYD CI Validation,OU=CI,O=AquaCYD,C=PL"
          {
            printf 'storePassword=ci-validation-only\n'
            printf 'keyPassword=ci-validation-only\n'
            printf 'keyAlias=ci-validation\n'
            printf 'storeFile=%s\n' "$key_path"
          } > apps/aquacyd_service/android/key.properties
          flutter_sdk="$(dirname "$(dirname "$(command -v flutter)")")"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' \
            "$android_sdk" "$flutter_sdk" \
            > apps/aquacyd_service/android/local.properties
          chmod +x apps/aquacyd_service/android/gradlew
      - name: Resolve Flutter dependencies
        working-directory: apps/aquacyd_service
        run: flutter pub get
      - name: Check Dart formatting
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.dart' |
            xargs -0 dart format --output=none --set-exit-if-changed
      - name: Analyze and test shared Dart packages
        shell: bash
        run: |
          set -euo pipefail
          for package in packages/*; do
            test -f "$package/pubspec.yaml" || continue
            (
              cd "$package"
              flutter pub get
              flutter analyze
              if [[ -d test ]]; then
                flutter test
              fi
            )
          done
      - name: Analyze Flutter
        working-directory: apps/aquacyd_service
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: apps/aquacyd_service
        run: flutter test --coverage
      - name: Validate Home Control application
        working-directory: apps/home_control
        run: |
          flutter pub get
          flutter analyze
          flutter test --coverage
          flutter build web --release
          flutter build apk --debug
      - name: Run Android unit tests
        working-directory: apps/aquacyd_service/android
        run: ./gradlew testCurrentDebugUnitTest --no-daemon --console=plain
      - name: Compile release variant with disposable identity
        working-directory: apps/aquacyd_service
        run: >
          flutter build apk
          --release
          --flavor current
          --target lib/main.dart
      - name: Verify notification icon survived release shrinking
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/aquacyd_service/build/app/outputs/flutter-apk/app-current-release.apk"
          build_tools="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools"
          aapt_path="$(
            find "$build_tools" -type f -name aapt -print |
              sort -V |
              tail -n 1
          )"
          resources="$RUNNER_TEMP/aquacyd-apk-resources.txt"
          test -s "$apk"
          test -x "$aapt_path"
          "$aapt_path" dump resources "$apk" > "$resources"
          grep -F \
            "pl.cydakwarium.cyd_aquarium_mobile:drawable/ic_notification" \
            "$resources" >/dev/null || {
              echo "Release APK does not contain drawable/ic_notification" >&2
              exit 1
            }
      - name: Produce explicitly unsigned validation APK
        shell: bash
        run: |
          set -euo pipefail
          signed="apps/aquacyd_service/build/app/outputs/flutter-apk/app-current-release.apk"
          unpacked="$RUNNER_TEMP/aquacyd-apk-unpacked"
          output="artifacts/AquaCYD-Control-ci-current-unsigned.apk"
          test -s "$signed"
          mkdir -p "$unpacked" artifacts
          unzip -q "$signed" -d "$unpacked"
          find "$unpacked/META-INF" -type f \
            \( -name '*.RSA' -o -name '*.DSA' -o -name '*.EC' \
               -o -name '*.SF' -o -name '*.MF' \) \
            -delete 2>/dev/null || true
          (
            cd "$unpacked"
            zip -q -r -X "$GITHUB_WORKSPACE/$output" .
          )
          apksigner_path="$(
            find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" \
              -type f -name apksigner -print |
              sort -V |
              tail -n 1
          )"
          test -x "$apksigner_path"
          if "$apksigner_path" verify "$output"; then
            echo "Validation artifact unexpectedly contains a valid signature" >&2
            exit 1
          fi
          sha256sum "$output" > "$output.sha256"
          rm -f "$signed" apps/aquacyd_service/android/key.properties \
            "$RUNNER_TEMP/aquacyd-ci-validation.jks"
      - name: Generate validation CycloneDX SBOMs
        shell: bash
        run: |
          set -euo pipefail
          mobile_version="$(
            sed -n 's/^version: \([0-9][0-9.]*\)+[0-9][0-9]*$/\1/p' \
              apps/aquacyd_service/pubspec.yaml
          )"
          home_version="$(
            sed -n 's/^version: \([0-9][0-9.]*\)+[0-9][0-9]*$/\1/p' \
              apps/home_control/pubspec.yaml
          )"
          test -n "$mobile_version"
          test -n "$home_version"
          cp \
            apps/home_control/build/app/outputs/flutter-apk/app-debug.apk \
            artifacts/Home-Control-ci-debug.apk
          sha256sum artifacts/Home-Control-ci-debug.apk \
            > artifacts/Home-Control-ci-debug.apk.sha256
          python tools/generate_sbom.py \
            --kind mobile \
            --version "$mobile_version" \
            --artifact artifacts/AquaCYD-Control-ci-current-unsigned.apk \
            --output artifacts/AquaCYD-Control-ci.cdx.json
          python tools/generate_sbom.py \
            --kind home \
            --version "$home_version" \
            --artifact artifacts/Home-Control-ci-debug.apk \
            --output artifacts/Home-Control-ci.cdx.json
      - name: Upload Flutter coverage and Android test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-test-reports
          path: |
            apps/aquacyd_service/coverage/lcov.info
            apps/aquacyd_service/build/reports/tests/
            apps/home_control/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
      - name: Upload unsigned validation APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unsigned-validation
          path: artifacts/AquaCYD-Control-ci-current-unsigned.apk*
          if-no-files-found: error
          retention-days: 7
      - name: Upload validation SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-sboms
          path: artifacts/*.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Home Control debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: home-control-android-debug
          path: artifacts/Home-Control-ci-debug.apk*
          if-no-files-found: error
          retention-days: 7

  home-windows:
    name: Home Control Windows installer
    needs: changes
    if: needs.changes.outputs.home == 'true'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - name: Install pinned Inno Setup
        id: inno
        shell: pwsh
        run: |
          $compiler = ./scripts/install_inno_setup.ps1
          "compiler=$compiler" >> $env:GITHUB_OUTPUT
      - name: Build release bundle and installer wizard
        shell: pwsh
        run: |
          ./scripts/build_home_control_windows.ps1 `
            -InnoCompiler '${{ steps.inno.outputs.compiler }}' `
            -OutputDirectory artifacts/home-control-windows
      - name: Smoke-test silent install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem `
            -LiteralPath artifacts/home-control-windows `
            -Filter '*-Setup.exe' `
            -File)
          if ($setup.Count -ne 1) {
            throw "Expected exactly one Windows Setup; got $($setup.Count)."
          }
          ./scripts/test_home_control_windows_installer.ps1 `
            -InstallerPath $setup.FullName `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP 'Home Control smoke')
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: home-control-windows-installer
          path: artifacts/home-control-windows/*-Setup.exe
          if-no-files-found: error
          retention-days: 7

  flutter-emulator-smoke:
    name: Android notification smoke (API 35)
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.14"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - name: Prepare deterministic Android debug build
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/aquacyd-emulator-validation.jks"
          keytool -genkeypair \
            -keystore "$key_path" \
            -storepass emulator-validation-only \
            -keypass emulator-validation-only \
            -alias emulator-validation \
            -keyalg RSA \
            -keysize 3072 \
            -validity 1 \
            -dname "CN=AquaCYD Emulator Validation,OU=CI,O=AquaCYD,C=PL"
          {
            printf 'storePassword=emulator-validation-only\n'
            printf 'keyPassword=emulator-validation-only\n'
            printf 'keyAlias=emulator-validation\n'
            printf 'storeFile=%s\n' "$key_path"
          } > apps/aquacyd_service/android/key.properties
          flutter_sdk="$(dirname "$(dirname "$(command -v flutter)")")"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' \
            "$android_sdk" "$flutter_sdk" \
            > apps/aquacyd_service/android/local.properties
          chmod +x apps/aquacyd_service/android/gradlew
          (
            cd apps/aquacyd_service
            flutter pub get
            flutter test test/notification_intents_test.dart
          )
          for attempt in 1 2 3; do
            if (
              cd apps/aquacyd_service/android
              ./gradlew --version --no-daemon
            ); then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Gradle wrapper bootstrap failed after $attempt attempts" >&2
              exit 1
            fi
            delay_seconds=$((attempt * 10))
            echo "Gradle wrapper bootstrap failed; retrying in ${delay_seconds}s" >&2
            sleep "$delay_seconds"
          done
      - name: Enable Linux KVM for the Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo \
            'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise notification channels, delivery and deep-link launch
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009 # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          working-directory: apps/aquacyd_service
          script: bash ../../tools/android-emulator-smoke.sh
      - name: Upload Android emulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-emulator-smoke-diagnostics
          path: artifacts/android-emulator/
          if-no-files-found: warn
          retention-days: 7
