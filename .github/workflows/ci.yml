name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Release and HIL tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.1"
          cache: false
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Compile Python tools
        run: python -m compileall -q scripts tools
      - name: Exercise release validator
        shell: bash
        run: |
          mobile_version="$(
            sed -n 's/^version: \([0-9][0-9.]*\)+[0-9][0-9]*$/\1/p' \
              mobile_app/pubspec.yaml
          )"
          firmware_version="$(
            sed -n 's/^constexpr char VERSION\[\] = "\([0-9][0-9.]*\)";$/\1/p' \
              include/config.h
          )"
          test -n "$mobile_version"
          test -n "$firmware_version"
          python scripts/validate_release.py --self-test
          python scripts/validate_release.py \
            --tag "mobile-v$mobile_version" \
            --pubspec mobile_app/pubspec.yaml \
            --dry-run
          python scripts/validate_release.py \
            --tag "firmware-v$firmware_version" \
            --firmware-config include/config.h \
            --dry-run
          python scripts/verify_firmware_trust.py
          python tools/firmware_package.py self-test
          python tools/web_package.py --self-test
          python tools/install_web_bundle.py --self-test
          python tools/generate_sbom.py --self-test
          python scripts/audit_esp32_security.py --self-test
      - name: Exercise HIL runner without hardware
        run: |
          python tools/hil/runner.py --self-test
          python tools/hil/runner.py --dry-run
          if python tools/hil/runner.py --dry-run --forbid-skips; then
            echo "Strict HIL dry-run unexpectedly accepted skipped scenarios" >&2
            exit 1
          fi

  web:
    name: Web and Node
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: >
          find web tools/dev-server tools/web-e2e
          -type f -name '*.js' -print0 |
          xargs -0 -n1 node --check
      - name: Run API simulator tests
        run: npm run test:api
      - name: Run secure gateway tests
        run: npm run test:gateway
      - name: Verify generated embedded web assets
        run: |
          npm run build:web-assets
          git diff --exit-code -- sdcard/aq/ota
          test -z "$(
            git ls-files \
              --others \
              --exclude-standard \
              -- sdcard/aq/ota
          )"
      - name: Install browser compatibility matrix
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser, accessibility and responsive tests
        run: npm run test:e2e
      - name: Package web artifact
        run: |
          mkdir -p artifacts
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf artifacts/AquaCYD-web-ci.tar.gz \
            web sdcard/aq/ota
          sha256sum artifacts/AquaCYD-web-ci.tar.gz \
            > artifacts/AquaCYD-web-ci.tar.gz.sha256
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-test-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload web bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-assets
          path: artifacts/AquaCYD-web-ci.tar.gz*
          if-no-files-found: error
          retention-days: 14

  firmware:
    name: PlatformIO firmware
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.19
      - name: Run native domain tests
        run: pio test --environment native
      - name: Build production firmware variants
        run: |
          pio run --environment esp32dev
          pio run --environment esp32dev-st7789
          pio run --environment esp32dev-espnow
      - name: Collect firmware binaries and checksums
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\firmware"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item `
            ".pio\build\esp32dev\firmware.bin" `
            (Join-Path $artifactDir "AquaCYD-Firmware-ci-ili9341.bin")
          Copy-Item `
            ".pio\build\esp32dev-st7789\firmware.bin" `
            (Join-Path $artifactDir "AquaCYD-Firmware-ci-st7789.bin")
          $checksumLines = Get-ChildItem -LiteralPath $artifactDir -Filter "*.bin" |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          Set-Content `
            -LiteralPath (Join-Path $artifactDir "SHA256SUMS") `
            -Value $checksumLines `
            -Encoding ascii
      - name: Upload firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-binaries
          path: artifacts/firmware/
          if-no-files-found: error
          retention-days: 14

  flutter:
    name: Flutter and Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.14"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - name: Create validation identity and recreate ignored Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/aquacyd-ci-validation.jks"
          keytool -genkeypair \
            -keystore "$key_path" \
            -storepass ci-validation-only \
            -keypass ci-validation-only \
            -alias ci-validation \
            -keyalg RSA \
            -keysize 3072 \
            -validity 1 \
            -dname "CN=AquaCYD CI Validation,OU=CI,O=AquaCYD,C=PL"
          {
            printf 'storePassword=ci-validation-only\n'
            printf 'keyPassword=ci-validation-only\n'
            printf 'keyAlias=ci-validation\n'
            printf 'storeFile=%s\n' "$key_path"
          } > mobile_app/android/key.properties
          flutter_sdk="$(dirname "$(dirname "$(command -v flutter)")")"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' \
            "$android_sdk" "$flutter_sdk" \
            > mobile_app/android/local.properties
          gradle \
            --project-dir mobile_app/android \
            wrapper \
            --gradle-version 8.14 \
            --distribution-type all
          chmod +x mobile_app/android/gradlew
      - name: Resolve Flutter dependencies
        working-directory: mobile_app
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: mobile_app
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: mobile_app
        run: flutter test --coverage
      - name: Run Android unit tests
        working-directory: mobile_app/android
        run: ./gradlew testCurrentDebugUnitTest --no-daemon --console=plain
      - name: Compile release variant with disposable identity
        working-directory: mobile_app
        run: >
          flutter build apk
          --release
          --flavor current
          --target lib/main.dart
      - name: Verify notification icon survived release shrinking
        shell: bash
        run: |
          set -euo pipefail
          apk="mobile_app/build/app/outputs/flutter-apk/app-current-release.apk"
          build_tools="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools"
          aapt_path="$(
            find "$build_tools" -type f -name aapt -print |
              sort -V |
              tail -n 1
          )"
          resources="$RUNNER_TEMP/aquacyd-apk-resources.txt"
          test -s "$apk"
          test -x "$aapt_path"
          "$aapt_path" dump resources "$apk" > "$resources"
          grep -F \
            "pl.cydakwarium.cyd_aquarium_mobile:drawable/ic_notification" \
            "$resources" >/dev/null || {
              echo "Release APK does not contain drawable/ic_notification" >&2
              exit 1
            }
      - name: Produce explicitly unsigned validation APK
        shell: bash
        run: |
          set -euo pipefail
          signed="mobile_app/build/app/outputs/flutter-apk/app-current-release.apk"
          unpacked="$RUNNER_TEMP/aquacyd-apk-unpacked"
          output="artifacts/AquaCYD-Control-ci-current-unsigned.apk"
          test -s "$signed"
          mkdir -p "$unpacked" artifacts
          unzip -q "$signed" -d "$unpacked"
          find "$unpacked/META-INF" -type f \
            \( -name '*.RSA' -o -name '*.DSA' -o -name '*.EC' \
               -o -name '*.SF' -o -name '*.MF' \) \
            -delete 2>/dev/null || true
          (
            cd "$unpacked"
            zip -q -r -X "$GITHUB_WORKSPACE/$output" .
          )
          apksigner_path="$(
            find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" \
              -type f -name apksigner -print |
              sort -V |
              tail -n 1
          )"
          test -x "$apksigner_path"
          if "$apksigner_path" verify "$output"; then
            echo "Validation artifact unexpectedly contains a valid signature" >&2
            exit 1
          fi
          sha256sum "$output" > "$output.sha256"
          rm -f "$signed" mobile_app/android/key.properties \
            "$RUNNER_TEMP/aquacyd-ci-validation.jks"
      - name: Upload Flutter coverage and Android test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-test-reports
          path: |
            mobile_app/coverage/lcov.info
            mobile_app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload unsigned validation APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unsigned-validation
          path: artifacts/AquaCYD-Control-ci-current-unsigned.apk*
          if-no-files-found: error
          retention-days: 7

  flutter-emulator-smoke:
    name: Android notification smoke (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.14"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - name: Prepare deterministic Android debug build
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/aquacyd-emulator-validation.jks"
          keytool -genkeypair \
            -keystore "$key_path" \
            -storepass emulator-validation-only \
            -keypass emulator-validation-only \
            -alias emulator-validation \
            -keyalg RSA \
            -keysize 3072 \
            -validity 1 \
            -dname "CN=AquaCYD Emulator Validation,OU=CI,O=AquaCYD,C=PL"
          {
            printf 'storePassword=emulator-validation-only\n'
            printf 'keyPassword=emulator-validation-only\n'
            printf 'keyAlias=emulator-validation\n'
            printf 'storeFile=%s\n' "$key_path"
          } > mobile_app/android/key.properties
          flutter_sdk="$(dirname "$(dirname "$(command -v flutter)")")"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' \
            "$android_sdk" "$flutter_sdk" \
            > mobile_app/android/local.properties
          gradle \
            --project-dir mobile_app/android \
            wrapper \
            --gradle-version 8.14 \
            --distribution-type all
          chmod +x mobile_app/android/gradlew
          (
            cd mobile_app
            flutter pub get
            flutter test test/notification_intents_test.dart
          )
      - name: Enable Linux KVM for the Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo \
            'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise notification channels, delivery and deep-link launch
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009 # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          working-directory: mobile_app
          script: bash ../tools/android-emulator-smoke.sh
      - name: Upload Android emulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-emulator-smoke-diagnostics
          path: artifacts/android-emulator/
          if-no-files-found: warn
          retention-days: 7
