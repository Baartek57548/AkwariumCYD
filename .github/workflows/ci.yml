name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Release and HIL tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: false
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Compile Python tools
        run: python -m compileall -q scripts tools/hil
      - name: Exercise release validator
        shell: bash
        run: |
          version="$(
            sed -n 's/^version: \([0-9][0-9.]*\)+[0-9][0-9]*$/\1/p' \
              mobile_app/pubspec.yaml
          )"
          test -n "$version"
          python scripts/validate_release.py --self-test
          python scripts/validate_release.py \
            --tag "mobile-v$version" \
            --pubspec mobile_app/pubspec.yaml \
            --dry-run
      - name: Exercise HIL runner without hardware
        run: |
          python tools/hil/runner.py --self-test
          python tools/hil/runner.py --dry-run

  web:
    name: Web and Node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: >
          find web tools/dev-server tools/web-e2e
          -type f -name '*.js' -print0 |
          xargs -0 -n1 node --check
      - name: Run API simulator tests
        run: npm run test:api
      - name: Verify generated embedded web assets
        run: |
          npm run build:web-assets
          git diff --exit-code -- sdcard/aq/ota
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Package web artifact
        run: |
          mkdir -p artifacts
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf artifacts/AquaCYD-web-ci.tar.gz \
            web sdcard/aq/ota
          sha256sum artifacts/AquaCYD-web-ci.tar.gz \
            > artifacts/AquaCYD-web-ci.tar.gz.sha256
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: artifacts/AquaCYD-web-ci.tar.gz*
          if-no-files-found: error
          retention-days: 14

  firmware:
    name: PlatformIO firmware
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.19
      - name: Run native domain tests
        run: pio test --environment native
      - name: Build production firmware variants
        run: |
          pio run --environment esp32dev
          pio run --environment esp32dev-st7789
      - name: Collect firmware binaries and checksums
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\firmware"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item `
            ".pio\build\esp32dev\firmware.bin" `
            (Join-Path $artifactDir "AquaCYD-Firmware-ci-ili9341.bin")
          Copy-Item `
            ".pio\build\esp32dev-st7789\firmware.bin" `
            (Join-Path $artifactDir "AquaCYD-Firmware-ci-st7789.bin")
          $checksumLines = Get-ChildItem -LiteralPath $artifactDir -Filter "*.bin" |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          Set-Content `
            -LiteralPath (Join-Path $artifactDir "SHA256SUMS") `
            -Value $checksumLines `
            -Encoding ascii
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: artifacts/firmware/
          if-no-files-found: error
          retention-days: 14

  flutter:
    name: Flutter and Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - name: Create validation identity and recreate ignored Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/aquacyd-ci-validation.jks"
          keytool -genkeypair \
            -keystore "$key_path" \
            -storepass ci-validation-only \
            -keypass ci-validation-only \
            -alias ci-validation \
            -keyalg RSA \
            -keysize 3072 \
            -validity 1 \
            -dname "CN=AquaCYD CI Validation,OU=CI,O=AquaCYD,C=PL"
          {
            printf 'storePassword=ci-validation-only\n'
            printf 'keyPassword=ci-validation-only\n'
            printf 'keyAlias=ci-validation\n'
            printf 'storeFile=%s\n' "$key_path"
          } > mobile_app/android/key.properties
          flutter_sdk="$(dirname "$(dirname "$(command -v flutter)")")"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' \
            "$android_sdk" "$flutter_sdk" \
            > mobile_app/android/local.properties
          gradle \
            --project-dir mobile_app/android \
            wrapper \
            --gradle-version 8.14 \
            --distribution-type all
          chmod +x mobile_app/android/gradlew
      - name: Resolve Flutter dependencies
        working-directory: mobile_app
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: mobile_app
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: mobile_app
        run: flutter test --coverage
      - name: Run Android unit tests
        working-directory: mobile_app/android
        run: ./gradlew testCurrentDebugUnitTest --no-daemon --console=plain
      - name: Compile release variant with disposable identity
        working-directory: mobile_app
        run: >
          flutter build apk
          --release
          --flavor current
          --target lib/main.dart
      - name: Produce explicitly unsigned validation APK
        shell: bash
        run: |
          set -euo pipefail
          signed="mobile_app/build/app/outputs/flutter-apk/app-current-release.apk"
          unpacked="$RUNNER_TEMP/aquacyd-apk-unpacked"
          output="artifacts/AquaCYD-Control-ci-current-unsigned.apk"
          test -s "$signed"
          mkdir -p "$unpacked" artifacts
          unzip -q "$signed" -d "$unpacked"
          find "$unpacked/META-INF" -type f \
            \( -name '*.RSA' -o -name '*.DSA' -o -name '*.EC' \
               -o -name '*.SF' -o -name '*.MF' \) \
            -delete 2>/dev/null || true
          (
            cd "$unpacked"
            zip -q -r -X "$GITHUB_WORKSPACE/$output" .
          )
          apksigner_path="$(
            find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" \
              -type f -name apksigner -print |
              sort -V |
              tail -n 1
          )"
          test -x "$apksigner_path"
          if "$apksigner_path" verify "$output"; then
            echo "Validation artifact unexpectedly contains a valid signature" >&2
            exit 1
          fi
          sha256sum "$output" > "$output.sha256"
          rm -f "$signed" mobile_app/android/key.properties \
            "$RUNNER_TEMP/aquacyd-ci-validation.jks"
      - name: Upload Flutter coverage and Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-reports
          path: |
            mobile_app/coverage/lcov.info
            mobile_app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload unsigned validation APK
        uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-validation
          path: artifacts/AquaCYD-Control-ci-current-unsigned.apk*
          if-no-files-found: error
          retention-days: 7
