name: aquacyd_home
description: Home Control — natywne, uniwersalne centrum urządzeń i czujników.
publish_to: 'none'
version: 2.2.0+8

environment:
  sdk: ^3.11.3

dependencies:
  aquacyd_design_system:
    path: ../../packages/design_system
  aquacyd_protocol:
    path: ../../packages/aquacyd_protocol
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0
  home_entities:
    path: ../../packages/home_entities
  intl: ^0.20.2
  local_auth: ^3.0.2
  nsd: ^5.0.1
  path_provider: ^2.1.5
  secure_connectivity:
    path: ../../packages/secure_connectivity
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3

dev_dependencies:
  aquacyd_test_support:
    path: ../../packages/test_support
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
