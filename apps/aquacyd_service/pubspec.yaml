name: cyd_aquarium_mobile
description: AquaCYD Control — mobilny panel sterownika akwarium dla Androida i iOS.
publish_to: 'none'
version: 6.0.0+20

environment:
  sdk: ^3.11.3

dependencies:
  aquacyd_design_system:
    path: ../../packages/design_system
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  firebase_core: ^4.12.1
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.2.0
  flutter_reactive_ble: ^5.5.0
  flutter_secure_storage: ^10.3.1
  permission_handler: ^12.0.3
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  sqflite_common: ^2.5.8
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.12.0
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: 2.4.0+3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/aquacyd-control-icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/aquacyd-control-icon.png
  min_sdk_android: 24
  remove_alpha_ios: true

hooks:
  user_defines:
    sqlite3:
      source: system
      name: sqlite3
      name_windows: winsqlite3
