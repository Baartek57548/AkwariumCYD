[platformio]
src_dir = ..
default_envs = lvgl_preview

[env:lvgl_preview]
platform = platformio/native@1.2.1
platform_packages = platformio/toolchain-gccmingw32@1.50100.0
lib_deps = lvgl/lvgl@8.4.0
extra_scripts = pre:../../../tools/native_toolchain.py
build_src_filter =
    -<*>
    +<src/ui_app.cpp>
    +<src/ui_model.cpp>
    +<src/ui_plan.cpp>
    +<src/ui_history_view.cpp>
    +<src/ui_history_time.cpp>
    +<src/ui_status.cpp>
    +<src/ui_runtime.cpp>
    +<src/ui_theme.cpp>
    +<src/ui_io.cpp>
    +<src/fonts/*.c>
    +<preview/src/*.cpp>
build_flags =
    -std=gnu++11
    -D LV_CONF_INCLUDE_SIMPLE
    -D AQUARIUM_UI_HOST_PREVIEW=1
    -I ../include
    -I include
    -finput-charset=UTF-8
    -fexec-charset=UTF-8
