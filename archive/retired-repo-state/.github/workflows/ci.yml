name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected products
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tooling: ${{ steps.filter.outputs.tooling }}
      web: ${{ steps.filter.outputs.web }}
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: filter
        name: Classify changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed="__all__"
          else
            base="$BEFORE_SHA"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$BASE_SHA"
            fi
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              changed="__all__"
            else
              changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
            fi
          fi
          classify() {
            local name="$1"
            local pattern="$2"
            if [[ "$changed" == "__all__" ]] ||
               grep -Eq "$pattern" <<<"$changed"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }
          classify tooling '^(.github/|scripts/|tools/|package(-lock)?.json|pubspec.yaml)'
          classify web '^(web/|sdcard/|tools/dev-server/|tools/web-e2e/|services/remote_gateway/|package(-lock)?.json)'
          classify firmware '^(firmware/cyd_controller/|firmware/shared/|web/|sdcard/|platformio.ini)'

  secret-security:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan commits for credentials and private keys
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependency-security:
    name: Dependency vulnerability scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --recursive
        ./
      upload-sarif: false
      fail-on-vuln: true

  tooling:
    name: Release and HIL tooling
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.1"
          cache: false
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Compile Python tools
        run: python -m compileall -q scripts tools
      - name: Exercise release validator
        shell: bash
        run: |
          firmware_version="$(
            sed -n 's/^constexpr char VERSION\[\] = "\([0-9][0-9.]*\)";$/\1/p' \
              firmware/cyd_controller/include/config.h
          )"
          test -n "$firmware_version"
          python scripts/validate_release.py --self-test
          python scripts/validate_release.py \
            --tag "firmware-v$firmware_version" \
            --firmware-config firmware/cyd_controller/include/config.h \
            --dry-run
          python scripts/verify_firmware_trust.py
          python tools/firmware_package.py self-test
          python tools/web_package.py --self-test
          python tools/install_web_bundle.py --self-test
          python tools/generate_sbom.py --self-test
          python scripts/audit_esp32_security.py --self-test
      - name: Exercise HIL runner without hardware
        run: |
          python tools/hil/runner.py --self-test
          python tools/hil/runner.py --dry-run
          if python tools/hil/runner.py --dry-run --forbid-skips; then
            echo "Strict HIL dry-run unexpectedly accepted skipped scenarios" >&2
            exit 1
          fi

  web:
    name: Web and Node
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: >
          find web tools/dev-server tools/web-e2e
          -type f -name '*.js' -print0 |
          xargs -0 -n1 node --check
      - name: Run API simulator tests
        run: npm run test:api
      - name: Run secure gateway tests
        run: npm run test:gateway
      - name: Verify generated embedded web assets
        run: |
          npm run build:web-assets
          git diff --exit-code -- sdcard/aq/ota
          test -z "$(
            git ls-files \
              --others \
              --exclude-standard \
              -- sdcard/aq/ota
          )"
      - name: Install browser compatibility matrix
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser, accessibility and responsive tests
        run: npm run test:e2e
      - name: Package web artifact
        run: |
          mkdir -p artifacts
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf artifacts/AquaCYD-web-ci.tar.gz \
            web sdcard/aq/ota
          sha256sum artifacts/AquaCYD-web-ci.tar.gz \
            > artifacts/AquaCYD-web-ci.tar.gz.sha256
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-test-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload web bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-assets
          path: artifacts/AquaCYD-web-ci.tar.gz*
          if-no-files-found: error
          retention-days: 14
  firmware:
    name: PlatformIO firmware
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/cyd_controller/platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.19
      - name: Run native domain tests
        run: pio test --project-dir firmware/cyd_controller --environment native
      - name: Build production firmware variants
        run: |
          pio run --project-dir firmware/cyd_controller --environment cyd_2_8
          pio run --project-dir firmware/cyd_controller --environment esp32dev-st7789
      - name: Collect firmware binaries and checksums
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\firmware"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item `
            "firmware\cyd_controller\.pio\build\cyd_2_8\firmware.bin" `
            (Join-Path $artifactDir "AquaCYD-Firmware-ci-ili9341.bin")
          Copy-Item `
            "firmware\cyd_controller\.pio\build\esp32dev-st7789\firmware.bin" `
            (Join-Path $artifactDir "AquaCYD-Firmware-ci-st7789.bin")
          $checksumLines = Get-ChildItem -LiteralPath $artifactDir -Filter "*.bin" |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          Set-Content `
            -LiteralPath (Join-Path $artifactDir "SHA256SUMS") `
            -Value $checksumLines `
            -Encoding ascii
      - name: Upload firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-binaries
          path: artifacts/firmware/
          if-no-files-found: error
          retention-days: 14
