; Reproducible PlatformIO profiles for the CYD aquarium controller.
; Build artifacts use PlatformIO's project-local default: .pio/build/<environment>.

[platformio]
; Restore this project's ST7789 panel; cyd_2_8 is the separate ILI9341 build.
; Keep the explicit variants distinct for signed firmware packaging.
default_envs = esp32dev-st7789

[cyd_firmware]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = min_spiffs.csv
lib_extra_dirs = ../shared

lib_deps =
    uart_protocol
    lvgl/lvgl@8.4.0
    lovyan03/LovyanGFX@1.2.21
    paulstoffregen/OneWire@2.3.8
    bblanchon/ArduinoJson@^6.21.4

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    ; UART0 is reserved for the CYD <-> AquaBox protocol, never ESP-IDF logs.
    -D AQUARIUM_ENABLE_UART_LOGS=0
    -I include
    -finput-charset=UTF-8
    -fexec-charset=UTF-8

; Production profile for the common ESP32-2432S028R/CYD 2.8-inch with ILI9341.
[env:cyd_2_8]
extends = cyd_firmware
build_flags =
    ${cyd_firmware.build_flags}
    -D AQUARIUM_FORCE_DEVELOPER_MODE=0
    -D AQUARIUM_ALLOW_UNSIGNED_ARDUINO_OTA=0
    -D CYD_PANEL_ST7789=0
    -D CORE_DEBUG_LEVEL=0

; Backward-compatible name retained for existing scripts such as
; "pio run -e esp32dev". It is byte-for-byte the same CYD 2.8-inch profile.
[env:esp32dev]
extends = cyd_firmware
build_flags =
    ${cyd_firmware.build_flags}
    -D AQUARIUM_FORCE_DEVELOPER_MODE=0
    -D AQUARIUM_ALLOW_UNSIGNED_ARDUINO_OTA=0
    -D CYD_PANEL_ST7789=0
    -D CORE_DEBUG_LEVEL=0

; Development profile: simulated sensors and outputs, verbose ESP32 logging.
[env:esp32dev-dev]
extends = cyd_firmware
build_flags =
    ${cyd_firmware.build_flags}
    -D AQUARIUM_FORCE_DEVELOPER_MODE=1
    -D AQUARIUM_ALLOW_UNSIGNED_ARDUINO_OTA=1
    -D CYD_PANEL_ST7789=0
    -D CORE_DEBUG_LEVEL=0

; Production profile for boards fitted with the ST7789 panel.
[env:esp32dev-st7789]
extends = cyd_firmware
build_flags =
    ${cyd_firmware.build_flags}
    -D AQUARIUM_FORCE_DEVELOPER_MODE=0
    -D AQUARIUM_ALLOW_UNSIGNED_ARDUINO_OTA=0
    -D CYD_PANEL_ST7789=1
    -D CORE_DEBUG_LEVEL=0

[env:native]
platform = platformio/native@1.2.1
platform_packages =
    platformio/toolchain-gccmingw32@1.50100.0
lib_extra_dirs = ../shared
lib_deps =
    bblanchon/ArduinoJson@^6.21.4
extra_scripts = pre:../../scripts/native_toolchain.py
test_framework = unity
test_filter = test_native_domain
test_build_src = no
build_flags =
    -std=gnu++11
    -static
    -static-libgcc
    -static-libstdc++
