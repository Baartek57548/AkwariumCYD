; PlatformIO entry point for the AquaCYD monorepo.
; Firmware sources remain in firmware/cyd_controller so non-firmware projects
; can coexist in this repository without being compiled by PlatformIO.

[platformio]
; This project's CYD used ST7789 before the display-driver regression.
; Select the hardware-specific profile explicitly; cyd_2_8 remains ILI9341.
default_envs = esp32dev-st7789, wemos_d1_uno
src_dir = firmware
test_dir = firmware/cyd_controller/test

[cyd_firmware]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = min_spiffs.csv
lib_extra_dirs = firmware/shared, firmware/cyd_controller/lib

lib_deps =
    uart_protocol
    lvgl/lvgl@8.4.0
    lovyan03/LovyanGFX@1.2.21
    paulstoffregen/OneWire@2.3.8
    bblanchon/ArduinoJson@^6.21.4

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    ; UART0 is reserved for the CYD <-> AquaBox protocol, never ESP-IDF logs.
    -D AQUARIUM_ENABLE_UART_LOGS=0
    -I firmware/cyd_controller/include
    -I firmware/shared/uart_protocol/include
    -finput-charset=UTF-8
    -fexec-charset=UTF-8

build_src_filter = -<*> +<cyd_controller/src/*>

; ESP32-2432S028R: 2.8-inch CYD with ILI9341 and XPT2046 touch controller.
[env:cyd_2_8]
extends = cyd_firmware
build_flags =
    ${cyd_firmware.build_flags}
    -D AQUARIUM_FORCE_DEVELOPER_MODE=0
    -D AQUARIUM_ALLOW_UNSIGNED_ARDUINO_OTA=0
    -D CYD_PANEL_ST7789=0
    -D CORE_DEBUG_LEVEL=0

; Existing scripts can continue to use the former production environment name.
[env:esp32dev]
extends = cyd_firmware
build_flags =
    ${cyd_firmware.build_flags}
    -D AQUARIUM_FORCE_DEVELOPER_MODE=0
    -D AQUARIUM_ALLOW_UNSIGNED_ARDUINO_OTA=0
    -D CYD_PANEL_ST7789=0
    -D CORE_DEBUG_LEVEL=0

[env:esp32dev-dev]
extends = cyd_firmware
build_flags =
    ${cyd_firmware.build_flags}
    -D AQUARIUM_FORCE_DEVELOPER_MODE=1
    -D AQUARIUM_ALLOW_UNSIGNED_ARDUINO_OTA=1
    -D CYD_PANEL_ST7789=0
    -D CORE_DEBUG_LEVEL=0

[env:esp32dev-st7789]
extends = cyd_firmware
build_flags =
    ${cyd_firmware.build_flags}
    -D AQUARIUM_FORCE_DEVELOPER_MODE=0
    -D AQUARIUM_ALLOW_UNSIGNED_ARDUINO_OTA=0
    -D CYD_PANEL_ST7789=1
    -D CORE_DEBUG_LEVEL=0

; Isolated first-boot check for the ESP32-S3-WROOM-1-N16R8 module.
; It does not drive the RGB panel or any external GPIO until the carrier-board
; header and display connector are verified on the physical hardware.
[env:esp32s3_n16r8_bringup]
platform = platformio/espressif32@7.0.1
board = esp32-s3-wroom-1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = -<*> +<esp32s3_bringup/src/*>
build_flags =
    -finput-charset=UTF-8
    -fexec-charset=UTF-8

; Standalone 800x480 RGB565 color-bar and GT911 I2C test.
; Upload only after GPIO19/20 are disconnected from the touch panel.
[env:esp32s3_waveshare_lcd_test]
platform = platformio/espressif32@7.0.1
board = esp32-s3-wroom-1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = -<*> +<esp32s3_lcd_test/src/*>
build_flags =
    -finput-charset=UTF-8
    -fexec-charset=UTF-8

; Isolated 800x480 local UI port. This environment uses Arduino core 3.x /
; ESP-IDF 5.x because the verified RGB framebuffer and bounce-buffer APIs
; are not available in the older core used by the CYD firmware.
[env:esp32s3_waveshare_ui]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38
board = esp32-s3-wroom-1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@^6.21.4
build_src_filter = -<*> +<esp32s3_ui/src/*>
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I firmware/esp32s3_ui/include
    -finput-charset=UTF-8
    -fexec-charset=UTF-8

[wemos_firmware]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.ldscript = eagle.flash.4m2m.ld
lib_extra_dirs = firmware/shared
lib_deps =
    bblanchon/ArduinoJson@^6.21.4
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@^4.0.6
build_flags =
    -I firmware/wemos_controller/include
    -finput-charset=UTF-8
    -fexec-charset=UTF-8
build_src_filter = -<*> +<wemos_controller/src/*>

[env:wemos_d1_uno]
extends = wemos_firmware

; ==============================================================================
; Środowiska diagnostyczne i testowe modułów WeMos D1
; ==============================================================================
[env:test_wemos_diag]
extends = wemos_firmware
build_src_filter = -<*> +<wemos_tests/test_interactive_diag.cpp>

[env:test_wemos_i2c]
extends = wemos_firmware
build_src_filter = -<*> +<wemos_tests/test_i2c_scanner.cpp>

[env:test_wemos_relays]
extends = wemos_firmware
build_src_filter = -<*> +<wemos_tests/test_mcp23017_relays.cpp>

[env:test_wemos_temp]
extends = wemos_firmware
build_src_filter = -<*> +<wemos_tests/test_ds18b20_temp.cpp>

[env:test_wemos_rtc]
extends = wemos_firmware
build_src_filter = -<*> +<wemos_tests/test_ds3231_rtc.cpp>

[env:test_wemos_ads1115]
extends = wemos_firmware
build_src_filter = -<*> +<wemos_tests/test_ads1115_adc.cpp>

[env:native]
platform = platformio/native@1.2.1
platform_packages =
    platformio/toolchain-gccmingw32@1.50100.0
lib_extra_dirs = firmware/shared, firmware/cyd_controller/lib
lib_deps =
    bblanchon/ArduinoJson@^6.21.4
extra_scripts = pre:scripts/native_toolchain.py
test_framework = unity
test_filter = test_native_domain
test_build_src = no
build_flags =
    -std=gnu++11
    -static
    -static-libgcc
    -static-libstdc++

; Real LVGL lifecycle regression tests without ESP32 hardware.
[env:native_ui]
extends = env:native
lib_deps = lvgl/lvgl@8.4.0
test_filter = test_native_ui
build_flags =
    ${env:native.build_flags}
    -D LV_CONF_INCLUDE_SIMPLE
    -I firmware/cyd_controller/include
